# Publica el sitio en GitHub Pages con la copia que armó el Panel.
# Se dispara con el botón «Publicar» del Panel (repository_dispatch), a mano,
# y cada madrugada mediante un activador del Panel. Si algo falla antes del
# despliegue, la web anterior sigue en línea.
#
# Orden: datos y fotos → sitio → revista, catálogo PDF y carrusel → verificación → subida.
name: Publicar sitio

on:
  workflow_dispatch:
  repository_dispatch:
    types: [publicar]

# Solo lectura por defecto; el job de despliegue pide lo suyo.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Las fotos ya procesadas se reutilizan. La clave cambia si cambia el
      # proceso (fotos.mjs, rutas.mjs); el índice además lleva su propia versión.
      - name: Caché de fotos procesadas
        uses: actions/cache@v6
        with:
          path: web/.cache
          key: fotos-${{ runner.os }}-${{ hashFiles('web/scripts/lib/fotos.mjs', 'web/src/components/imprimir/rutas.mjs') }}-${{ github.run_id }}
          restore-keys: |
            fotos-${{ runner.os }}-${{ hashFiles('web/scripts/lib/fotos.mjs', 'web/src/components/imprimir/rutas.mjs') }}-
            fotos-${{ runner.os }}-

      - name: Datos y fotos desde la API
        run: npm run publicar -w web
        env:
          CATALOG_API_URL: ${{ vars.CATALOG_API_URL }}
      - name: Construir el sitio
        run: npm run build -w web
        env:
          PUBLIC_API_URL: ${{ vars.CATALOG_API_URL }}

      # Chromium para imprimir los PDF: se guarda por versión de Playwright.
      - name: Versión de Playwright
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Caché de Chromium
        id: cache-chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Instalar Chromium
        if: steps.cache-chromium.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium
        working-directory: web
      - name: Dependencias del sistema para Chromium
        if: steps.cache-chromium.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: web

      - name: Revista, catálogo PDF y carrusel
        run: npm run documentos -w web
      - name: Verificar páginas, vistas previas y documentos
        run: npm run verificar:build -w web -- --con-documentos
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: despliegue
        uses: actions/deploy-pages@v5
