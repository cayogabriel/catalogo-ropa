<script>
/* Caché de miniaturas. Las fotos son privadas en Drive: el Panel las pide a Apps Script en lotes de 40. */
(function (P) {
  /**
   * crearMiniaturas({ pedir(ids) → Promesa({id: dataUrl}), tamanoLote = 40, cache = {}, alCambiar })
   * src(id) devuelve la miniatura o '' y la pide en segundo plano (una sola vez por id).
   */
  function crearMiniaturas(o) {
    var lote = o.tamanoLote || 40;
    var cache = o.cache || {};
    var pidiendo = {};
    var fallidas = {};
    var cola = [];
    var programado = false;

    function avisar() { if (o.alCambiar) o.alCambiar(); }

    function enviar() {
      programado = false;
      var ids = cola;
      cola = [];
      for (var i = 0; i < ids.length; i += lote) {
        (function (grupo) {
          Promise.resolve()
            .then(function () { return o.pedir(grupo); })
            .then(function (mapa) {
              grupo.forEach(function (id) {
                if (mapa && mapa[id]) cache[id] = mapa[id];
                else fallidas[id] = true;
                delete pidiendo[id];
              });
              avisar();
            })
            .catch(function () {
              grupo.forEach(function (id) { fallidas[id] = true; delete pidiendo[id]; });
            });
        })(ids.slice(i, i + lote));
      }
    }

    function pedir(ids) {
      ids.forEach(function (id) {
        if (!id || cache[id] || pidiendo[id] || fallidas[id]) return;
        pidiendo[id] = true;
        cola.push(id);
      });
      if (cola.length && !programado) {
        programado = true;
        Promise.resolve().then(enviar);
      }
    }

    return {
      cache: cache,
      src: function (id) {
        if (!id) return '';
        if (cache[id]) return cache[id];
        pedir([id]);
        return '';
      },
      pedir: pedir,
      agregar: function (id, url) { cache[id] = url; avisar(); },
      reintentar: function () { fallidas = {}; },
    };
  }

  P.crearMiniaturas = crearMiniaturas;
})((window.Panel = window.Panel || {}));
</script>
