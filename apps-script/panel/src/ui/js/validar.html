<script>
/* Validaciones de formularios y contraste de paletas. Cada función de formulario devuelve
 * { campo: 'mensaje' } (vacío = todo bien). El servidor vuelve a validar: esto solo evita viajes de ida y vuelta. */
(function (P) {
  var TOKENS = [
    '--color-fondo', '--color-superficie', '--color-texto', '--color-texto-suave', '--color-borde', '--color-control',
    '--color-primario', '--color-sobre-primario', '--color-acento', '--color-sobre-acento', '--color-oferta',
    '--color-sobre-oferta', '--color-liquidacion', '--color-sobre-liquidacion', '--color-exito', '--color-foco',
  ];
  // Copia de PARES_CONTRASTE de @catalogo/contratos (docs/contracts/tokens-diseno.md). Un test comprueba que son iguales.
  var PARES_CONTRASTE = [
    { a: '--color-texto', b: '--color-fondo', min: 4.5 },
    { a: '--color-texto-suave', b: '--color-fondo', min: 4.5 },
    { a: '--color-texto', b: '--color-superficie', min: 4.5 },
    { a: '--color-texto-suave', b: '--color-superficie', min: 4.5 },
    { a: '--color-sobre-primario', b: '--color-primario', min: 4.5 },
    { a: '--color-sobre-acento', b: '--color-acento', min: 4.5 },
    { a: '--color-sobre-oferta', b: '--color-oferta', min: 4.5 },
    { a: '--color-sobre-liquidacion', b: '--color-liquidacion', min: 4.5 },
    { a: '--color-control', b: '--color-fondo', min: 3 },
    { a: '--color-foco', b: '--color-fondo', min: 3 },
    { a: '--color-primario', b: '--color-fondo', min: 3 },
  ];

  /* ---------- contraste (WCAG 2.1) ---------- */
  function canal(v) {
    var c = v / 255;
    return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
  }
  function luminancia(hex) {
    var m = /^#([0-9a-f]{6})$/i.exec(hex);
    if (!m) throw new Error('color inválido: ' + hex);
    var n = parseInt(m[1], 16);
    return 0.2126 * canal((n >> 16) & 255) + 0.7152 * canal((n >> 8) & 255) + 0.0722 * canal(n & 255);
  }
  function contraste(a, b) {
    var la = luminancia(a);
    var lb = luminancia(b);
    var claro = la > lb ? la : lb;
    var oscuro = la > lb ? lb : la;
    return (claro + 0.05) / (oscuro + 0.05);
  }
  function revisarPaletaLocal(tokens) {
    var faltantes = TOKENS.filter(function (t) { return !(t in tokens); });
    var fallos = [];
    PARES_CONTRASTE.forEach(function (par) {
      if (!(par.a in tokens) || !(par.b in tokens)) return;
      var valor;
      try { valor = contraste(tokens[par.a], tokens[par.b]); } catch (e) { valor = 1; }
      if (valor < par.min) fallos.push({ a: par.a, b: par.b, min: par.min, valor: Math.round(valor * 100) / 100 });
    });
    return { ok: faltantes.length === 0 && fallos.length === 0, faltantes: faltantes, fallos: fallos };
  }

  var NOMBRES = {
    fondo: 'el fondo', superficie: 'las tarjetas', texto: 'el texto', 'texto-suave': 'el texto secundario',
    borde: 'los separadores', control: 'los bordes de los campos', primario: 'el color de los botones',
    'sobre-primario': 'el texto sobre el botón', acento: 'el color de acento', 'sobre-acento': 'el texto sobre el acento',
    oferta: 'las insignias de oferta', 'sobre-oferta': 'el texto de las insignias de oferta',
    liquidacion: 'la sección de liquidación', 'sobre-liquidacion': 'el texto de la liquidación',
    exito: 'el color de confirmación', foco: 'el anillo de foco del teclado',
  };
  function nombreToken(t) { return NOMBRES[t.replace('--color-', '')] || t; }
  function mayus(t) { return t.charAt(0).toUpperCase() + t.slice(1); }

  /** Frases para la dueña: qué color no se lee bien y cuánto falta. */
  function describirFallos(r) {
    var frases = r.fallos.map(function (f) {
      var esTexto = /texto|sobre-/.test(f.a);
      var union = esTexto ? ' se lee con dificultad sobre ' : ' casi no se distingue de ';
      return mayus(nombreToken(f.a)) + union + nombreToken(f.b) + ' (contraste ' + f.valor.toFixed(1) + ', mínimo ' + f.min + ').';
    });
    r.faltantes.forEach(function (t) { frases.push('Falta definir ' + nombreToken(t) + '.'); });
    return frases;
  }

  /* ---------- campos sueltos ---------- */
  function limpiarWhatsapp(t) { return String(t || '').replace(/[\s+\-().]/g, ''); }
  function whatsapp(texto) {
    var t = String(texto || '').trim();
    if (!t) return 'Escribe el número de WhatsApp.';
    if (/[a-zA-Z]/.test(t)) return 'Usa solo números, sin letras.';
    var d = limpiarWhatsapp(t);
    if (!/^\d+$/.test(d)) return 'Usa solo números (puedes poner espacios o +).';
    if (d.length <= 9) return 'Falta el código de país. Ejemplo para Perú: 51 9XX XXX XXX.';
    if (d.length > 15) return 'El número es demasiado largo.';
    return '';
  }
  function hex(t) {
    return /^#[0-9a-fA-F]{6}$/.test(String(t || '')) ? '' : 'Escribe el color como #RRGGBB, por ejemplo #1B2B34.';
  }

  /** Acepta coma o punto decimal («66,5» o «66.5»). */
  function num(x) { return Number(String(x === null || x === undefined ? '' : x).replace(',', '.')); }
  function ms(iso) { return iso ? new Date(iso).getTime() : null; }
  function finAntes(desde, hasta) { return desde && hasta && ms(hasta) <= ms(desde); }
  var MSJ_FIN = 'La fecha de fin debe ser posterior a la de inicio.';
  function slugOk(s) { return /^[a-z0-9-]+$/.test(s || ''); }

  /* ---------- formularios ---------- */
  function producto(f) {
    var e = {};
    var borrador = f.estado === 'borrador' || f.estado === 'archivado';
    var nombre = String(f.nombre || '').trim();
    if (!nombre && !borrador) e.nombre = 'Escribe el nombre de la prenda.';
    if (nombre.length > 80) e.nombre = 'El nombre admite hasta 80 letras.';
    if (String(f.descripcion || '').length > 600) e.descripcion = 'La descripción admite hasta 600 letras.';
    var precio = f.precio_regular;
    if (precio === null || precio === undefined || precio === '') {
      if (!borrador) e.precio_regular = 'Falta el precio.';
    } else if (!(num(precio) > 0)) {
      e.precio_regular = 'El precio debe ser mayor que 0.';
    }
    var tallas = f.tallas || [];
    var fuera = (f.tallas_agotadas || []).filter(function (t) { return tallas.indexOf(t) === -1; });
    if (fuera.length) e.tallas_agotadas = 'La talla ' + fuera.join(', ') + ' está agotada pero no está en la lista de tallas.';
    if (f.estado === 'publicado' && !(f.fotos || []).length) e.fotos = 'Agrega al menos una foto para publicarla.';
    return e;
  }

  function oferta(f) {
    var e = {};
    if (!String(f.nombre || '').trim()) e.nombre = 'Ponle un nombre para reconocerla.';
    var v = num(f.valor);
    if (!(v > 0)) e.valor = 'El valor debe ser mayor que 0.';
    else if (f.tipo === 'porcentaje' && (v < 1 || v > 90)) e.valor = 'El porcentaje va de 1 a 90.';
    if (finAntes(f.desde, f.hasta)) e.hasta = MSJ_FIN;
    if (f.cuenta_regresiva && !f.hasta) e.cuenta_regresiva = 'Para mostrar la cuenta regresiva pon una fecha de fin.';
    if (f.alcance && f.alcance !== 'tienda' && !(f.objetivos || []).length) e.objetivos = 'Elige a qué se aplica.';
    return e;
  }

  function vendedora(f) {
    var e = {};
    if (!String(f.nombre || '').trim()) e.nombre = 'Escribe el nombre.';
    var w = whatsapp(f.whatsapp);
    if (w) e.whatsapp = w;
    return e;
  }

  function temporada(f, todas) {
    var e = {};
    if (!String(f.nombre || '').trim()) e.nombre = 'Escribe el nombre de la temporada.';
    if (!slugOk(f.slug)) e.slug = 'El enlace solo admite letras minúsculas sin tilde, números y guiones.';
    else if ((todas || []).some(function (t) { return t.id !== f.id && t.slug === f.slug; })) e.slug = 'Ya existe otra temporada con ese enlace.';
    if (finAntes(f.desde, f.hasta)) e.hasta = MSJ_FIN;
    var d = f.vigencia_dias;
    if (d !== null && d !== undefined && d !== '' && !(Number.isInteger(Number(d)) && Number(d) >= 1)) e.vigencia_dias = 'Pon un número de días entero, de 1 en adelante.';
    return e;
  }

  function portada(f) {
    var e = {};
    if (!String(f.titulo || '').trim()) e.titulo = 'Ponle un título.';
    if (f.boton_destino && f.boton_destino.charAt(0) !== '/') e.boton_destino = 'Elige una página de tu tienda para el botón.';
    if (finAntes(f.desde, f.hasta)) e.hasta = MSJ_FIN;
    return e;
  }

  function categoria(f) {
    var e = {};
    if (!String(f.nombre || '').trim()) e.nombre = 'Escribe el nombre.';
    if (!slugOk(f.slug)) e.slug = 'El enlace solo admite letras minúsculas sin tilde, números y guiones.';
    if (!/^[A-Z]{3}$/.test(f.prefijo_codigo || '')) e.prefijo_codigo = 'El prefijo son 3 letras mayúsculas, por ejemplo VES.';
    return e;
  }

  var NUMEROS = { umbral_ultimas_unidades: 0, dias_nuevo: 1, min_clics_mas_consultados: 1, vigencia_dias_defecto: 1 };
  /** Un solo ajuste de Configuración. '' = válido. */
  function config(clave, valor) {
    var t = String(valor === null || valor === undefined ? '' : valor).trim();
    if (clave === 'tienda_nombre') return t ? '' : 'La tienda necesita un nombre para publicarse.';
    if (clave in NUMEROS) return /^\d+$/.test(t) && Number(t) >= NUMEROS[clave] ? '' : 'Escribe un número entero' + (NUMEROS[clave] ? ', de ' + NUMEROS[clave] + ' en adelante.' : '.');
    if (clave === 'redondeo') return ['ninguno', 'entero', '90'].indexOf(t) !== -1 ? '' : 'Elige una de las opciones.';
    if (clave === 'inicio_modo') return ['temporada', 'secciones'].indexOf(t) !== -1 ? '' : 'Elige una de las opciones.';
    if (clave === 'pais_codigo') return /^\d{1,3}$/.test(t) ? '' : 'Solo el número del país, sin +. Perú es 51.';
    if (clave === 'moneda_codigo') return /^[A-Z]{3}$/.test(t) ? '' : 'Son 3 letras mayúsculas, por ejemplo PEN.';
    if (clave === 'moneda_simbolo') return t && t.length <= 4 ? '' : 'Escribe el símbolo, por ejemplo S/.';
    return '';
  }

  P.validar = {
    TOKENS: TOKENS, PARES_CONTRASTE: PARES_CONTRASTE, contraste: contraste, revisarPaletaLocal: revisarPaletaLocal,
    describirFallos: describirFallos, nombreToken: nombreToken, limpiarWhatsapp: limpiarWhatsapp, whatsapp: whatsapp,
    hex: hex, producto: producto, oferta: oferta, vendedora: vendedora, temporada: temporada, portada: portada,
    categoria: categoria, config: config,
  };
})((window.Panel = window.Panel || {}));
</script>
